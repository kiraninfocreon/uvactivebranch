# Local development only — for staging/production use managed Neon/
# DigitalOcean Postgres and managed Redis instead of these containers.
version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uvactive
      POSTGRES_PASSWORD: uvactive_dev_only
      POSTGRES_DB: uvactive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
